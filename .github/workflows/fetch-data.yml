name: Fetch Stock Data

on:
  schedule:
    - cron: '0 * * * *'   # 毎時0分に自動実行
  workflow_dispatch:        # 手動実行も可能

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stock data from Yahoo Finance
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import urllib.parse
          import json
          import time

          def fetch_yahoo(symbol):
              encoded = urllib.parse.quote(symbol, safe='')
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{encoded}?interval=1d&range=1mo"
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
              })
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      data = json.loads(resp.read())
                      result = data['chart']['result'][0]
                      meta   = result['meta']
                      closes     = result['indicators']['quote'][0].get('close', [])
                      timestamps = result.get('timestamp', [])
                      pairs = [(t, c) for t, c in zip(timestamps, closes) if c is not None]
                      return {
                          'price':     meta.get('regularMarketPrice'),
                          'prevClose': meta.get('chartPreviousClose') or meta.get('previousClose'),
                          'timestamps': [p[0] for p in pairs[-30:]],
                          'closes':     [p[1] for p in pairs[-30:]]
                      }
              except Exception as e:
                  print(f"Error fetching {symbol}: {e}")
                  return None

          result = {
              'updated': int(time.time()),
              'etf':    fetch_yahoo('2840.T'),
              'ndx':    fetch_yahoo('^NDX'),
              'usdjpy': fetch_yahoo('USDJPY=X'),
          }

          with open('data.json', 'w') as f:
              json.dump(result, f)

          for k, v in result.items():
              if k != 'updated' and v:
                  print(f"{k}: {v['price']}")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "chore: update stock data [skip ci]"
          git push
