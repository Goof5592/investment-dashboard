name: Fetch Stock Data

on:
  schedule:
    - cron: '0 * * * *'   # 毎時0分に自動実行
  workflow_dispatch:        # 手動実行も可能

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch all stock data and news
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import urllib.parse
          import json
          import time
          import xml.etree.ElementTree as ET

          HEADERS = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}

          def translate_to_ja(text):
              try:
                  encoded = urllib.parse.quote(text)
                  url = f"https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ja&dt=t&q={encoded}"
                  req = urllib.request.Request(url, headers=HEADERS)
                  with urllib.request.urlopen(req, timeout=5) as resp:
                      result = json.loads(resp.read())
                      return ''.join(seg[0] for seg in result[0] if seg[0])
              except Exception as e:
                  print(f"Translation error: {e}")
                  return text

          def fetch_fundamentals(symbol):
              encoded = urllib.parse.quote(symbol, safe='')
              url = f"https://query1.finance.yahoo.com/v10/finance/quoteSummary/{encoded}?modules=defaultKeyStatistics,financialData,summaryDetail"
              req = urllib.request.Request(url, headers=HEADERS)
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      data = json.loads(resp.read())
                      result = data['quoteSummary']['result'][0]
                      ks = result.get('defaultKeyStatistics', {})
                      fd = result.get('financialData', {})
                      sd = result.get('summaryDetail', {})
                      def v(obj, key):
                          x = obj.get(key, {})
                          return x.get('raw') if isinstance(x, dict) else x
                      return {
                          'per':       v(sd, 'trailingPE') or v(ks, 'trailingPE'),
                          'pbr':       v(ks, 'priceToBook'),
                          'roe':       v(fd, 'returnOnEquity'),
                          'opMargin':  v(fd, 'operatingMargins'),
                          'revGrowth': v(fd, 'revenueGrowth'),
                          'divYield':  v(sd, 'dividendYield') or v(sd, 'trailingAnnualDividendYield'),
                      }
              except Exception as e:
                  print(f"Fundamentals error {symbol}: {e}")
                  return {}

          def fetch_yahoo(symbol, range='1mo', limit=30):
              encoded = urllib.parse.quote(symbol, safe='')
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{encoded}?interval=1d&range={range}"
              req = urllib.request.Request(url, headers=HEADERS)
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      data = json.loads(resp.read())
                      result = data['chart']['result'][0]
                      meta   = result['meta']
                      closes     = result['indicators']['quote'][0].get('close', [])
                      timestamps = result.get('timestamp', [])
                      pairs = [(t, c) for t, c in zip(timestamps, closes) if c is not None]
                      return {
                          'price':     meta.get('regularMarketPrice'),
                          'prevClose': meta.get('chartPreviousClose') or meta.get('previousClose'),
                          'timestamps': [p[0] for p in pairs[-limit:]],
                          'closes':     [p[1] for p in pairs[-limit:]]
                      }
              except Exception as e:
                  print(f"Error {symbol}: {e}")
                  return None

          def fetch_news(query, n=5):
              encoded = urllib.parse.quote(query)
              url = f"https://news.google.com/rss/search?q={encoded}&hl=ja&gl=JP&ceid=JP:ja"
              req = urllib.request.Request(url, headers=HEADERS)
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      root = ET.fromstring(resp.read())
                      items = []
                      for item in root.findall('.//item')[:n]:
                          title  = item.findtext('title', '')
                          link   = item.findtext('link', '#')
                          pub    = item.findtext('pubDate', '')
                          source = item.findtext('source', '')
                          items.append({'title': title, 'link': link, 'pub': pub, 'source': source})
                      return items
              except Exception as e:
                  print(f"News error '{query}': {e}")
                  return []

          # ── NASDAQ ダッシュボード用 ──────────────────────
          ipo_news_queries = [
              ('SpaceX IPO NASDAQ',  'spacex'),
              ('OpenAI IPO listing', 'openai'),
              ('Anthropic IPO',      'anthropic'),
          ]
          ipo_news = []
          ipo_seen = set()
          for query, tag in ipo_news_queries:
              url = f"https://news.google.com/rss/search?q={urllib.parse.quote(query)}&hl=en&gl=US&ceid=US:en"
              req = urllib.request.Request(url, headers=HEADERS)
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      root = ET.fromstring(resp.read())
                      for item in root.findall('.//item')[:3]:
                          title = item.findtext('title', '')
                          if title not in ipo_seen:
                              ipo_seen.add(title)
                              ipo_news.append({
                                  'title': translate_to_ja(title),
                                  'link':  item.findtext('link', '#'),
                                  'pub':   item.findtext('pubDate', ''),
                                  'tag':   tag,
                              })
              except Exception as e:
                  print(f"IPO news error '{query}': {e}")

          nasdaq = {
              'updated': int(time.time()),
              'etf':    fetch_yahoo('2840.T'),
              'ndx':    fetch_yahoo('^NDX'),
              'usdjpy': fetch_yahoo('USDJPY=X'),
              'news':   ipo_news,
          }
          with open('data.json', 'w') as f:
              json.dump(nasdaq, f)
          print("NASDAQ data saved")

          # ── レアアース ダッシュボード用 ───────────────────
          RE_STOCKS = [
              ('三井海洋開発',       '6269.T', 'high'),
              ('東洋エンジニアリング', '6330.T', 'high'),
              ('双日',              '2768.T', 'medium'),
              ('住友商事',           '8053.T', 'medium'),
              ('JX金属',            '5016.T', 'medium'),
              ('信越化学工業',        '4063.T', 'medium'),
              ('日立製作所',         '6501.T', 'low'),
              ('ダイキン工業',        '6367.T', 'low'),
              ('DOWAホールディングス', '5714.T', 'low'),
              ('古河機械金属',        '5715.T', 'low'),
          ]

          stocks = {}
          for name, symbol, tier in RE_STOCKS:
              d = fetch_yahoo(symbol, range='1y', limit=260)
              if d:
                  d['name'] = name
                  d['tier'] = tier
                  d['fund'] = fetch_fundamentals(symbol)
              stocks[symbol] = d
              print(f"{name}: {d['price'] if d else 'error'}")

          # ニュース収集（政策・公式発表寄り）
          from email.utils import parsedate_to_datetime
          import datetime

          news_queries = [
              ('経済産業省 レアアース',     'meti'),
              ('JOGMEC レアアース',        'jogmec'),
              ('南鳥島 レアアース 開発',    'minamitori'),
              ('レアアース 日本 政策 政府', 'policy'),
          ]
          all_news = []
          seen = set()
          cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=60)
          for query, tag in news_queries:
              for item in fetch_news(query, 6):
                  if item['title'] not in seen:
                      # 日付パース・フィルタ（60日以内のみ）
                      try:
                          pub_dt = parsedate_to_datetime(item['pub'])
                          if pub_dt < cutoff:
                              continue
                          item['pub_ts'] = int(pub_dt.timestamp())
                      except Exception:
                          item['pub_ts'] = 0
                      seen.add(item['title'])
                      item['tag'] = tag
                      all_news.append(item)

          # 新着順ソート・上位15件
          all_news.sort(key=lambda x: x.get('pub_ts', 0), reverse=True)
          all_news = all_news[:15]

          re_data = {
              'updated': int(time.time()),
              'stocks':  stocks,
              'news':    all_news,
          }
          with open('re-data.json', 'w', encoding='utf-8') as f:
              json.dump(re_data, f, ensure_ascii=False)
          print("Rare earth data saved")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json re-data.json
          git diff --staged --quiet || git commit -m "chore: update stock data [skip ci]"
          git push
