name: Fetch Stock Data

on:
  schedule:
    - cron: '0 * * * *'   # 毎時0分に自動実行
  workflow_dispatch:        # 手動実行も可能

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip3 install yfinance -q

      - name: Fetch all stock data and news
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import urllib.parse
          import json
          import time
          import xml.etree.ElementTree as ET

          HEADERS = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}

          def translate_to_ja(text):
              try:
                  encoded = urllib.parse.quote(text)
                  url = f"https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ja&dt=t&q={encoded}"
                  req = urllib.request.Request(url, headers=HEADERS)
                  with urllib.request.urlopen(req, timeout=5) as resp:
                      result = json.loads(resp.read())
                      return ''.join(seg[0] for seg in result[0] if seg[0])
              except Exception as e:
                  print(f"Translation error: {e}")
                  return text

          import yfinance as yf

          def fetch_fundamentals(symbol):
              try:
                  info = yf.Ticker(symbol).info
                  return {
                      'per':       info.get('trailingPE'),
                      'pbr':       info.get('priceToBook'),
                      'roe':       info.get('returnOnEquity'),
                      'opMargin':  info.get('operatingMargins'),
                      'revGrowth': info.get('revenueGrowth'),
                      'divYield':  info.get('dividendYield') or info.get('trailingAnnualDividendYield'),
                  }
              except Exception as e:
                  print(f"Fundamentals error {symbol}: {e}")
                  return {}

          def fetch_yahoo(symbol, range='1mo', limit=30, include_ohlc=False):
              encoded = urllib.parse.quote(symbol, safe='')
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{encoded}?interval=1d&range={range}"
              req = urllib.request.Request(url, headers=HEADERS)
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      data = json.loads(resp.read())
                      result = data['chart']['result'][0]
                      meta   = result['meta']
                      quote  = result['indicators']['quote'][0]
                      closes     = quote.get('close', [])
                      opens      = quote.get('open', []) if include_ohlc else []
                      highs      = quote.get('high', []) if include_ohlc else []
                      lows       = quote.get('low', []) if include_ohlc else []
                      timestamps = result.get('timestamp', [])

                      # nullをフィルタ（OHLC対応）
                      if include_ohlc:
                          pairs = [(t, o, h, l, c) for t, o, h, l, c in zip(timestamps, opens, highs, lows, closes)
                                  if c is not None]
                      else:
                          pairs = [(t, c) for t, c in zip(timestamps, closes) if c is not None]

                      if include_ohlc:
                          ohlc_data = [{
                              'time': int(p[0]),
                              'open': p[1],
                              'high': p[2],
                              'low': p[3],
                              'close': p[4]
                          } for p in pairs[-limit:]]
                          return {
                              'price':     meta.get('regularMarketPrice'),
                              'prevClose': meta.get('chartPreviousClose') or meta.get('previousClose'),
                              'timestamps': [p[0] for p in pairs[-limit:]],
                              'closes':     [p[4] for p in pairs[-limit:]],
                              'ohlc':       ohlc_data
                          }
                      else:
                          return {
                              'price':     meta.get('regularMarketPrice'),
                              'prevClose': meta.get('chartPreviousClose') or meta.get('previousClose'),
                              'timestamps': [p[0] for p in pairs[-limit:]],
                              'closes':     [p[1] for p in pairs[-limit:]]
                          }
              except Exception as e:
                  print(f"Error {symbol}: {e}")
                  return None

          def fetch_news(query, n=5):
              encoded = urllib.parse.quote(query)
              url = f"https://news.google.com/rss/search?q={encoded}&hl=ja&gl=JP&ceid=JP:ja"
              req = urllib.request.Request(url, headers=HEADERS)
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      root = ET.fromstring(resp.read())
                      items = []
                      for item in root.findall('.//item')[:n]:
                          title  = item.findtext('title', '')
                          link   = item.findtext('link', '#')
                          pub    = item.findtext('pubDate', '')
                          source = item.findtext('source', '')
                          items.append({'title': title, 'link': link, 'pub': pub, 'source': source})
                      return items
              except Exception as e:
                  print(f"News error '{query}': {e}")
                  return []

          # ── NASDAQ ダッシュボード用 ──────────────────────
          ipo_news_queries = [
              ('SpaceX IPO NASDAQ',  'spacex'),
              ('OpenAI IPO listing', 'openai'),
              ('Anthropic IPO',      'anthropic'),
          ]
          ipo_news = []
          ipo_seen = set()
          for query, tag in ipo_news_queries:
              url = f"https://news.google.com/rss/search?q={urllib.parse.quote(query)}&hl=en&gl=US&ceid=US:en"
              req = urllib.request.Request(url, headers=HEADERS)
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      root = ET.fromstring(resp.read())
                      for item in root.findall('.//item')[:3]:
                          title = item.findtext('title', '')
                          if title not in ipo_seen:
                              ipo_seen.add(title)
                              ipo_news.append({
                                  'title': translate_to_ja(title),
                                  'link':  item.findtext('link', '#'),
                                  'pub':   item.findtext('pubDate', ''),
                                  'tag':   tag,
                              })
              except Exception as e:
                  print(f"IPO news error '{query}': {e}")

          nasdaq = {
              'updated': int(time.time()),
              'etf':    fetch_yahoo('2840.T', include_ohlc=True),
              'ndx':    fetch_yahoo('^NDX'),
              'usdjpy': fetch_yahoo('USDJPY=X'),
              'news':   ipo_news,
          }
          with open('data.json', 'w') as f:
              json.dump(nasdaq, f)
          print("NASDAQ data saved")

          # ── レアアース ダッシュボード用 ───────────────────
          RE_STOCKS = [
              ('三井海洋開発',       '6269.T', 'high'),
              ('双日',              '2768.T', 'medium'),
              ('住友商事',           '8053.T', 'medium'),
              ('JX金属',            '5016.T', 'medium'),
              ('住友金属鉱山',        '5713.T', 'medium'),
              ('三井金属鉱業',        '5706.T', 'medium'),
              ('三菱マテリアル',       '5711.T', 'medium'),
              ('DOWAホールディングス', '5714.T', 'low'),
              ('古河機械金属',        '5715.T', 'low'),
          ]

          stocks = {}
          for name, symbol, tier in RE_STOCKS:
              d = fetch_yahoo(symbol, range='1y', limit=260, include_ohlc=True)
              if d:
                  d['name'] = name
                  d['tier'] = tier
                  d['fund'] = fetch_fundamentals(symbol)
              stocks[symbol] = d
              print(f"{name}: {d['price'] if d else 'error'}")

          # ニュース収集（政策・公式発表寄り）
          from email.utils import parsedate_to_datetime
          import datetime

          news_queries = [
              ('経済産業省 レアアース',     'meti'),
              ('JOGMEC レアアース',        'jogmec'),
              ('南鳥島 レアアース 開発',    'minamitori'),
              ('レアアース 日本 政策 政府', 'policy'),
          ]
          all_news = []
          seen = set()
          cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=60)
          for query, tag in news_queries:
              for item in fetch_news(query, 6):
                  if item['title'] not in seen:
                      # 日付パース・フィルタ（60日以内のみ）
                      try:
                          pub_dt = parsedate_to_datetime(item['pub'])
                          if pub_dt < cutoff:
                              continue
                          item['pub_ts'] = int(pub_dt.timestamp())
                      except Exception:
                          item['pub_ts'] = 0
                      seen.add(item['title'])
                      item['tag'] = tag
                      all_news.append(item)

          # 新着順ソート・上位15件
          all_news.sort(key=lambda x: x.get('pub_ts', 0), reverse=True)
          all_news = all_news[:15]

          re_data = {
              'updated': int(time.time()),
              'stocks':  stocks,
              'news':    all_news,
          }
          with open('re-data.json', 'w', encoding='utf-8') as f:
              json.dump(re_data, f, ensure_ascii=False)
          print("Rare earth data saved")

          # ── 半導体・AI ダッシュボード用 ─────────────────────
          SEMI_STOCKS = [
              ('ABEJA',               '5574.T', 'ai'),
              ('PKSHAテクノロジー',    '3993.T', 'ai'),
              ('東京エレクトロン',      '8035.T', 'equipment'),
              ('アドバンテスト',        '6857.T', 'equipment'),
              ('ディスコ',             '6146.T', 'equipment'),
              ('SCREENホールディングス','7735.T', 'equipment'),
              ('荏原製作所',           '6361.T', 'equipment'),
              ('豊田通商',             '8015.T', 'related'),
              ('京セラ',              '6971.T', 'related'),
              ('THK',                 '6481.T', 'related'),
              ('ブロードリーフ',        '3673.T', 'related'),
              ('川崎重工業',           '7012.T', 'related'),
          ]

          semi_stocks = {}
          for name, symbol, group in SEMI_STOCKS:
              d = fetch_yahoo(symbol, range='1y', limit=260, include_ohlc=True)
              if d:
                  d['name']  = name
                  d['group'] = group
                  d['fund']  = fetch_fundamentals(symbol)
              semi_stocks[symbol] = d
              print(f"{name}: {d['price'] if d else 'error'}")

          # 個別銘柄ニュース
          semi_news_queries = [
              ('ABEJA 株 AI',              '5574.T'),
              ('PKSHA テクノロジー 株',     '3993.T'),
              ('東京エレクトロン 株 決算',   '8035.T'),
              ('アドバンテスト 株 半導体',   '6857.T'),
              ('ディスコ 株 切削',          '6146.T'),
              ('SCREEN ホールディングス 株', '7735.T'),
              ('荏原製作所 株 決算',        '6361.T'),
              ('豊田通商 株 決算',          '8015.T'),
              ('京セラ 株 決算',            '6971.T'),
              ('THK 株 直動',              '6481.T'),
              ('ブロードリーフ 株',          '3673.T'),
              ('川崎重工業 フィジカルAI',    '7012.T'),
          ]

          cutoff_semi = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=60)
          semi_news = {}
          for query, symbol in semi_news_queries:
              items = []
              for item in fetch_news(query, 5):
                  try:
                      pub_dt = parsedate_to_datetime(item['pub'])
                      if pub_dt < cutoff_semi:
                          continue
                      item['pub_ts'] = int(pub_dt.timestamp())
                  except Exception:
                      item['pub_ts'] = 0
                  items.append(item)
              items.sort(key=lambda x: x.get('pub_ts', 0), reverse=True)
              semi_news[symbol] = items[:3]

          semi_data = {
              'updated': int(time.time()),
              'usdjpy':  fetch_yahoo('USDJPY=X'),
              'stocks':  semi_stocks,
              'news':    semi_news,
          }
          with open('semi-data.json', 'w', encoding='utf-8') as f:
              json.dump(semi_data, f, ensure_ascii=False)
          print("Semi data saved")

          # ── PKSHA ダッシュボード用 ─────────────────────────
          pksha_stock = fetch_yahoo('3993.T', range='1y', limit=260, include_ohlc=True)
          if pksha_stock:
              pksha_stock['fund'] = fetch_fundamentals('3993.T')

          pksha_news_queries = [
              'PKSHA Technology 決算',
              'PKSHAテクノロジー AI',
              'PKSHA 3993 株',
          ]
          pksha_news = []
          pksha_seen = set()
          cutoff_pksha = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=60)
          for query in pksha_news_queries:
              for item in fetch_news(query, 5):
                  if item['title'] not in pksha_seen:
                      try:
                          pub_dt = parsedate_to_datetime(item['pub'])
                          if pub_dt < cutoff_pksha:
                              continue
                          item['pub_ts'] = int(pub_dt.timestamp())
                      except Exception:
                          item['pub_ts'] = 0
                      pksha_seen.add(item['title'])
                      pksha_news.append(item)
          pksha_news.sort(key=lambda x: x.get('pub_ts', 0), reverse=True)
          pksha_news = pksha_news[:10]

          pksha_data = {
              'updated': int(time.time()),
              'stock':   pksha_stock,
              'news':    pksha_news,
          }
          with open('pksha-data.json', 'w', encoding='utf-8') as f:
              json.dump(pksha_data, f, ensure_ascii=False)
          print("PKSHA data saved")

          # ===== CEREBRAS (CBRS) NEWS =====
          cbrs_news_queries = [
              'Cerebras Systems CBRS',
              'Cerebras AI chip',
              'Cerebras wafer scale',
          ]
          cbrs_news = []
          cbrs_seen = set()
          cutoff_cbrs = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=60)
          for query in cbrs_news_queries:
              for item in fetch_news(query):
                  if item['title'] not in cbrs_seen:
                      if item.get('pub_ts'):
                          pub_dt = datetime.datetime.fromtimestamp(item['pub_ts'], tz=datetime.timezone.utc)
                          if pub_dt < cutoff_cbrs:
                              continue
                      cbrs_seen.add(item['title'])
                      cbrs_news.append(item)
          cbrs_news.sort(key=lambda x: x.get('pub_ts', 0), reverse=True)
          cbrs_news = cbrs_news[:10]

          # CBRS stock price
          cbrs_stock = fetch_yahoo('CBRS', range='1mo', limit=30)

          cbrs_data = {
              'updated': int(time.time()),
              'stock':   cbrs_stock,
              'news':    cbrs_news,
          }
          with open('cerebras-data.json', 'w', encoding='utf-8') as f:
              json.dump(cbrs_data, f, ensure_ascii=False)
          print("Cerebras data saved")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json re-data.json semi-data.json pksha-data.json cerebras-data.json
          git diff --staged --quiet || git commit -m "chore: update stock data [skip ci]"
          git push
